<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Page not found</title>
<!--
  Served by Cloudflare Pages for any path that does not exist, with a real 404
  status. Without this file Pages falls back to index.html and answers 200,
  which tells search engines that every mistyped URL is a real page.

  Self-contained on purpose. The site's Content-Security-Policy allows no
  inline script and no third-party fonts, so this page uses inline CSS (which
  the policy does permit) and the system font stack, and runs no JavaScript.
  It therefore renders correctly even when nothing else on the site loads.
-->
<style>
  :root {
    color-scheme: light dark;
    --paper: #f7f8fa;
    --ink: #171a1f;
    --ink-soft: #5a6472;
    --line: #dfe3ea;
    --accent: #0f62d6;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #101317;
      --ink: #e9edf2;
      --ink-soft: #99a3b2;
      --line: #272d35;
      --accent: #74a9ff;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--paper);
    color: var(--ink);
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  main {
    max-width: 30rem;
    text-align: center;
  }

  .code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: var(--ink-soft);
    margin: 0 0 10px;
  }

  h1 {
    font-size: clamp(1.5rem, 5vw, 2rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 12px;
    text-wrap: balance;
  }

  p {
    color: var(--ink-soft);
    margin: 0 0 24px;
  }

  a {
    display: inline-block;
    padding: 11px 22px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
  }

  a:hover { border-color: var(--accent); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>This page does not exist</h1>
    <p>The link may be mistyped, or the page may have moved. Everything on this site is free and runs in your browser.</p>
    <a href="/">Go to the home page</a>
  </main>
</body>
</html>
