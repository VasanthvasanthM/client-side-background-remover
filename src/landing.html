<!doctype html>
<html lang="{{LANG}}" dir="{{DIR}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />

    <title>{{PAGE_TITLE}}</title>
    <meta name="description" content="{{PAGE_DESCRIPTION}}" />
    <link rel="canonical" href="{{CANONICAL}}" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <meta property="og:type" content="article" />
    <meta property="og:site_name" content="{{t.app.name}}" />
    <meta property="og:title" content="{{PAGE_TITLE}}" />
    <meta property="og:description" content="{{PAGE_DESCRIPTION}}" />
    <meta property="og:url" content="{{CANONICAL}}" />
    <meta property="og:image" content="{{OG_IMAGE}}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="{{OG_LOCALE}}" />
{{OG_ALTERNATES}}
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{PAGE_TITLE}}" />
    <meta name="twitter:description" content="{{PAGE_DESCRIPTION}}" />
    <meta name="twitter:image" content="{{OG_IMAGE}}" />

{{HREFLANG}}

    <link rel="icon" href="{{ASSET_PREFIX}}assets/icon/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="{{ASSET_PREFIX}}assets/icon/apple-touch-icon.png" />
    <link rel="manifest" href="{{ASSET_PREFIX}}assets/site.webmanifest" />
    <link rel="stylesheet" href="{{ASSET_PREFIX}}assets/css/app.css{{CSS_VERSION}}" />

    <script type="application/ld+json">{{JSONLD}}</script>
{{GA4}}
{{ADS_HEAD}}
    <script src="{{ASSET_PREFIX}}assets/js/theme.js"></script>
  </head>

  <body class="min-h-screen">
    <a class="sr-only-focusable" href="#content">{{t.a11y.skip}}</a>

{{HEADER}}

    <main class="mx-auto max-w-3xl px-4 pb-16 pt-6 sm:px-6">
      <nav class="text-xs text-ink-500 dark:text-ink-400" aria-label="{{t.a11y.breadcrumb}}">
        <a class="link" href="{{HOME_HREF}}">{{t.app.name}}</a>
        <span aria-hidden="true" class="mx-1.5">/</span>
        <span>{{BREADCRUMB}}</span>
      </nav>

      <h1 id="content" class="mt-4 text-balance text-2xl font-extrabold tracking-tight sm:text-3xl">{{PAGE_H1}}</h1>

      <div class="card card-pad mt-6 flex flex-wrap items-center gap-3">
        <a class="btn-primary" href="{{TOOL_HREF}}" data-track="landing_cta">{{t.landing.cta}}</a>
        <p class="hint">{{t.landing.ctaHint}}</p>
      </div>

      <div class="prose-block mt-6">
{{PAGE_BODY}}
      </div>

{{AD_MID}}

      <section class="mt-10">
        <h2 class="text-lg font-bold">{{t.landing.relatedHeading}}</h2>
        <div class="mt-3 flex flex-wrap gap-2">
{{RELATED_LINKS}}
        </div>
      </section>
{{AD_END}}

    </main>

{{FOOTER}}

    <script type="application/json" id="i18n-dict">{{I18N_DICT}}</script>
    <script type="module" src="{{ASSET_PREFIX}}assets/js/landing.js"></script>
  </body>
</html>
