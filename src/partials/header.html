    <header
      class="sticky top-0 z-40 border-b border-ink-200/80 bg-ink-50/85 backdrop-blur dark:border-ink-800/80 dark:bg-ink-950/85"
    >
      <div class="mx-auto flex max-w-content items-center gap-3 px-4 py-2.5 sm:px-6">
        <a href="{{HOME_HREF}}" class="flex min-w-0 items-center gap-2.5">
          <span
            class="grid h-9 w-9 flex-none place-items-center rounded-xl bg-cut-600 text-white shadow-sm"
            aria-hidden="true"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="h-5 w-5" focusable="false">
              <circle cx="6" cy="6" r="2.6" />
              <circle cx="6" cy="18" r="2.6" />
              <path d="M8.1 7.6 20 18M20 6 8.1 16.4" />
            </svg>
          </span>
          <span class="min-w-0">
            <span class="block truncate text-sm font-bold leading-tight">{{t.app.name}}</span>
            <span class="hidden text-xs text-ink-500 dark:text-ink-400 sm:block">{{t.app.tagline}}</span>
          </span>
        </a>

        <div class="ms-auto flex items-center gap-1">
          <nav class="hidden items-center gap-0.5 sm:flex" aria-label="{{t.a11y.langPicker}}">
{{LANG_LINKS}}
          </nav>

          <label class="sr-only" for="lang-select">{{t.a11y.langPicker}}</label>
          <select id="lang-select" class="select max-w-[9rem] py-1.5 text-xs sm:hidden">
{{LANG_OPTIONS}}
          </select>

          <button type="button" class="btn-icon" data-theme-toggle aria-label="{{t.a11y.theme}}">
            <svg
              class="h-5 w-5 dark:hidden"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              aria-hidden="true"
              focusable="false"
            >
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m0-14.2-1.4 1.4M6.3 17.7l-1.4 1.4" />
            </svg>
            <svg
              class="hidden h-5 w-5 dark:block"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
            </svg>
          </button>
        </div>
      </div>
    </header>
