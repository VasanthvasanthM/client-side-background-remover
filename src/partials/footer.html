    <footer class="border-t border-ink-200 bg-white dark:border-ink-800 dark:bg-ink-900">
      <div class="mx-auto max-w-content px-4 py-10 sm:px-6">
        <div class="grid gap-8 sm:grid-cols-3">
          <div>
            <p class="text-sm font-bold">{{t.app.name}}</p>
            <p class="mt-2 text-sm text-ink-600 dark:text-ink-300">{{t.foot.privacy}}</p>
            <p class="mt-3 flex items-center gap-2 text-xs text-ink-500 dark:text-ink-400">
              <span data-storage-state>{{t.common.saved}}</span>
            </p>
            <button type="button" class="btn-ghost mt-2 px-2 py-1 text-xs" data-reset-storage>{{t.common.reset}}</button>
          </div>
          <nav aria-labelledby="foot-tools">
            <p class="text-sm font-bold" id="foot-tools">{{t.foot.tools}}</p>
            <ul class="mt-2 space-y-1.5 text-sm" role="list">
{{FOOTER_LINKS}}
            </ul>
          </nav>
          <nav aria-labelledby="foot-langs">
            <p class="text-sm font-bold" id="foot-langs">{{t.foot.languages}}</p>
            <ul class="mt-2 grid grid-cols-2 gap-1.5 text-sm" role="list">
{{FOOTER_LANGS}}
            </ul>
          </nav>
        </div>

        <div class="mt-8 border-t border-ink-200 pt-6 dark:border-ink-800">
          <p class="text-xs text-ink-500 dark:text-ink-400">{{t.foot.disclaimer}}</p>
          <!-- Rendered with the build year, then re-rendered by chrome.js with
               the browser's current year, so a page cached across New Year's
               Eve never shows a stale copyright. -->
          <p class="mt-2 text-xs text-ink-500 dark:text-ink-400" data-copyright>{{COPYRIGHT}}</p>
        </div>
      </div>
    </footer>
